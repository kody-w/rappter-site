name: public contracts verify
on:
  push:
    paths: ["mesh/**", "*.json", "*.html", ".well-known/agent.json", "llms.txt", "proofs/**", "try/**", "tests/**", ".github/workflows/mesh-verify.yml"]
  pull_request:
    paths: ["mesh/**", "*.json", "*.html", ".well-known/agent.json", "llms.txt", "proofs/**", "try/**", "tests/**", ".github/workflows/mesh-verify.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replay the chain and refuse drift
        run: python3 mesh/tools/build.py --check
      - name: the twin's two agent.json projections must match
        run: diff agent.json .well-known/agent.json
      - name: the free beta and disabled paid plan must keep their boundaries
        run: python3 -B -m unittest discover -s tests -p 'test_rental_contracts.py' -v
